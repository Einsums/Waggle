[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "waggle"
version = "0.1.0"
description = "The terminal viewer and session tools for the Waggle profiler"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
viewer = ["textual"]
test = ["pytest", "textual"]

[project.scripts]
waggle = "waggle.cli:main"

[tool.setuptools]
package-dir = { "" = "python" }

[tool.setuptools.packages.find]
where = ["python"]

[tool.setuptools.package-data]
waggle = ["*.tcss"]
