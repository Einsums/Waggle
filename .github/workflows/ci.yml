name: CI

on:
  push:
  pull_request:

env:
  # The mDNS discovery test fails rather than skips when a responder or zeroconf is missing.
  WAGGLE_REQUIRE_MDNS: "1"
  # The Linux job lowers kernel.perf_event_paranoid, so the counters test must not skip there.
  WAGGLE_REQUIRE_COUNTERS: "1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4

      - uses: conda-incubator/setup-miniconda@v3
        with:
          environment-file: environment.yml
          activate-environment: waggle-dev
          miniforge-version: latest

      - name: Give apiary clang's builtin headers
        # apiary parses with libclang, which on Linux finds stddef.h and the rest only in clang's
        # resource directory; the build compiles with GCC, so it has none. The version is apiary's
        # LLVM: another version's headers use builtins its libclang does not have.
        # Remove once apiary's package brings them (Einsums/Apiary#4).
        if: runner.os == 'Linux'
        run: conda install -y -c conda-forge "clang 23.*"

      - name: Let Instruments record without asking
        # xctrace records the signposts test; without developer tools enabled it waits for an
        # authorization nobody on a runner can give.
        if: runner.os == 'macOS'
        shell: bash
        run: sudo DevToolsSecurity -enable

      - name: Let processes count their own threads
        # Ubuntu sets kernel.perf_event_paranoid to 4, which refuses even software counters; the
        # counter backend's test opens a group of them, as the runner has no hardware ones.
        if: runner.os == 'Linux'
        shell: bash
        run: sudo sysctl -w kernel.perf_event_paranoid=1

      - name: Start an mDNS responder
        # Servers advertise themselves through the Avahi daemon, which the runner does not run.
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y avahi-daemon libavahi-client3
          sudo systemctl start avahi-daemon
          test -S /run/avahi-daemon/socket

      - name: Configure
        # A per-configuration output directory, as a parent project like Einsums sets, must not
        # move waggle._core out of the package (its Python tests require it).
        run: cmake -S . -B build -GNinja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DWAGGLE_BUILD_TESTS=ON -DWAGGLE_BUILD_PYTHON=ON -DCMAKE_LIBRARY_OUTPUT_DIRECTORY_RELWITHDEBINFO=${{ github.workspace }}/build/elsewhere -DWAGGLE_REQUIRE_OMPT_TEST=ON -DWAGGLE_REQUIRE_PERFETTO_TEST=ON

      - name: Build
        run: cmake --build build --target all waggle_tests

      - name: Test
        run: ctest --test-dir build --output-on-failure -j4

  windows:
    runs-on: windows-latest
    defaults:
      run:
        # conda-forge's compilers set up MSVC through a batch activation script.
        shell: cmd /C CALL {0}
    steps:
      - uses: actions/checkout@v4

      - uses: conda-incubator/setup-miniconda@v3
        with:
          environment-file: environment.yml
          activate-environment: waggle-dev
          miniforge-version: latest

      - name: Configure
        # A per-configuration output directory, as a parent project like Einsums sets, must not
        # move waggle._core out of the package (its Python tests require it).
        run: cmake -S . -B build -GNinja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DWAGGLE_BUILD_TESTS=ON -DWAGGLE_BUILD_PYTHON=ON -DCMAKE_LIBRARY_OUTPUT_DIRECTORY_RELWITHDEBINFO=${{ github.workspace }}/build/elsewhere

      - name: Build
        run: cmake --build build --target all waggle_tests

      - name: Test
        run: ctest --test-dir build --output-on-failure -j4

  docs:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4

      - uses: conda-incubator/setup-miniconda@v3
        with:
          environment-file: environment.yml
          activate-environment: waggle-dev
          miniforge-version: latest

      - name: Give apiary clang's builtin headers
        # As in the build job: apiary parses the headers for the C and C++ reference too.
        run: conda install -y -c conda-forge "clang 23.*"

      - name: Build the documentation
        # Warnings are errors and every cross-reference must resolve.
        run: |
          cmake -S . -B build -GNinja -DCMAKE_BUILD_TYPE=Release -DWAGGLE_BUILD_PYTHON=ON -DWAGGLE_BUILD_DOCS=ON -DWAGGLE_BUILD_TESTS=OFF
          cmake --build build --target waggle_docs

      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: build/docs/html

  pages:
    # main's documentation, published at https://einsums.github.io/Waggle.
    if: github.ref == 'refs/heads/main'
    needs: docs
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: pre-commit/action@v3.0.1
