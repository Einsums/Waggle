name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4

      - uses: conda-incubator/setup-miniconda@v3
        with:
          environment-file: environment.yml
          activate-environment: waggle-dev
          miniforge-version: latest

      - name: Give apiary clang's builtin headers
        # apiary parses with libclang, which on Linux finds stddef.h and the rest only in clang's
        # resource directory; the build compiles with GCC, so it has none. The version is apiary's
        # LLVM: another version's headers use builtins its libclang does not have.
        if: runner.os == 'Linux'
        run: conda install -y -c conda-forge "clang 23.*"

      - name: Configure
        run: cmake -S . -B build -GNinja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DWAGGLE_BUILD_TESTS=ON -DWAGGLE_BUILD_PYTHON=ON

      - name: Build
        run: cmake --build build --target all waggle_tests

      - name: Test
        run: ctest --test-dir build --output-on-failure -j4

  windows:
    runs-on: windows-latest
    defaults:
      run:
        # conda-forge's compilers set up MSVC through a batch activation script.
        shell: cmd /C CALL {0}
    steps:
      - uses: actions/checkout@v4

      - uses: conda-incubator/setup-miniconda@v3
        with:
          environment-file: environment.yml
          activate-environment: waggle-dev
          miniforge-version: latest

      - name: Configure
        run: cmake -S . -B build -GNinja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DWAGGLE_BUILD_TESTS=ON -DWAGGLE_BUILD_PYTHON=ON

      - name: Build
        run: cmake --build build --target all waggle_tests

      - name: Test
        run: ctest --test-dir build --output-on-failure -j4

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: pre-commit/action@v3.0.1
