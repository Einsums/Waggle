name: waggle-dev
channels:
  - conda-forge
dependencies:
  - cmake>=3.24
  - ninja
  - cxx-compiler
  - fmt>=12,<13
  - catch2>=3
  - python>=3.10
  - pybind11
  # apiary generates waggle._core from python/src/Core.hpp
  - apiary >=1.1,<2
  # apiary parses with libclang, which takes its builtin headers (stddef.h, ...) from clang's resource
  # directory; the Linux build compiles with GCC, so clang is here for that alone.
  - clang
  - pytest
  - textual
  - pre-commit
