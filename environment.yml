name: waggle-dev
channels:
  - conda-forge
dependencies:
  - cmake>=3.24
  - ninja
  - cxx-compiler
  - fmt>=12,<13
  - catch2>=3
  - python>=3.10
  - pybind11
  # LLVM's OpenMP runtime, which has OMPT, for the OpenMP source's test
  - llvm-openmp
  # apiary generates waggle._core from python/src/Core.hpp
  - apiary >=1.2,<2
  - pytest
  - pip
  - textual
  # the viewer's discovery of servers over mDNS
  - zeroconf
  - pre-commit
  # the documentation (WAGGLE_BUILD_DOCS)
  - sphinx
  - pydata-sphinx-theme
  - sphinx-copybutton
  - sphinx-design
  - pip:
      # trace_processor, which reads the Perfetto trace in its test
      - perfetto
