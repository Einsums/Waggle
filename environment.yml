name: waggle-dev
channels:
  - conda-forge
dependencies:
  - cmake>=3.24
  - ninja
  - cxx-compiler
  - fmt>=12,<13
  - catch2>=3
  - python>=3.10
  - pybind11
  # LLVM's OpenMP runtime, which has OMPT, for the OpenMP source's test
  - llvm-openmp
  # apiary generates waggle._core from python/src/Core.hpp
  - apiary >=1.1,<2
  - pytest
  - textual
  # the viewer's discovery of servers over mDNS
  - zeroconf
  - pre-commit
